[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "indiadata"
version = "0.2.0"
description = "Download official Indian economic data (MoSPI, World Bank) and read PLFS microdata as tidy pandas tables. Companion package to 'Python for Indian Economics Students'."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pandas>=2.0", "requests>=2.28", "numpy>=1.24", "openpyxl>=3.1"]

[tool.setuptools]
packages = ["indiadata"]
