[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "indiadata"
version = "0.1.0"
description = "Download official Indian economic data (MoSPI, World Bank) as tidy pandas tables. Companion package to 'Python for Indian Economics Students'."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "requests>=2.28"]

[tool.setuptools]
packages = ["indiadata"]
